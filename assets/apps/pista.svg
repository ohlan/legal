    <g transform="rotate(-12 54 81)">
      <path d="M54,27 C40,27 32,45 32,59 C32,72 42,81 54,81 Z" fill="url(#shellL)"/>
      <path d="M54,29.5 L54,79.5" stroke="#C9AE76" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M40,44 C37.5,50 37,56 38,62" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>
